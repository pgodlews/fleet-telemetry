name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        # Must match the `go` directive in go.mod. When it was 1.23 while
        # go.mod asked for 1.25, CI only worked because the toolchain was
        # downloaded on demand — so the version actually building was not the
        # one pinned anywhere.
        go-version: 1.25.0

    - name: Set up protoc
      run: |
        wget https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-linux-x86_64.zip
        unzip protoc-28.3-linux-x86_64.zip
        sudo mv bin/protoc /usr/local/bin/protoc
        sudo mv include/* /usr/local/include/

    - name: Install protoc-gen-go
      run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28.1

    - name: Generated protofiles are up to date
      run: |
        make generate-protos
        git diff --exit-code

    - name: No formatting changes
      run: |
        make format
        git diff --exit-code

    - name: Install ZMQ
      run: sudo apt update -y && sudo apt upgrade -y && sudo apt install -y libsodium-dev libzmq3-dev
    
    - name: Setup golangci-lint
      # Not enforced (see below): golangci-lint 1.61 is built with Go 1.23
      # and refuses this Go 1.25 module, so the step cannot pass until the
      # linter and .golangci.yml are migrated.
      continue-on-error: true
      uses: golangci/golangci-lint-action@v6
      with:
        # Lint is NOT enforced for this module: golangci-lint 1.61 predates the
        # Go 1.25 in go.mod, and .golangci.yml is still the v1 schema. Moving
        # to 2.x needs that file converted (version key, linters.settings,
        # gosimple folded into staticcheck, issues.exclude-dirs ->
        # linters.exclusions.paths) and the Makefile's v1-only
        # --exclude-use-default flag dropped. Until then treat a red or green
        # lint step here as meaningless; the fork-checks job below is the
        # gate for fork-owned code.
        version: v1.61.0

    - name: Linter passes
      continue-on-error: true   # not enforced, same reason as above
      run: make linters

    - name: Test
      run: make test

    - name: Integration Test
      run: make integration

  # Checks for the fork-owned code that need no libzmq: Go formatting, vet and
  # tests for the dispatcher and tools, the SQL migrations on a real
  # TimescaleDB (fresh install with the production runner, then FORCE=1), the
  # dashboards' JSON, and an EXPLAIN of every dashboard query as grafana_ro.
  fork-checks:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg16.13-ts2.26.4-all
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tesla
        # No host port: on the Gitea runner the job container and this service
        # share a Docker network and reach each other by service name, and
        # publishing 5432 collided with a database already on the runner host.
        options: >-
          --health-cmd "pg_isready -U postgres -d tesla"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGHOST: timescaledb
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      GRAFANA_RO_PASSWORD: ci-only-grafana
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25.0

    - name: gofmt
      run: |
        out=$(gofmt -l datastore/postgres tools)
        if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

    - name: go vet
      run: go vet ./tools/... ./datastore/postgres/...

    - name: go build (notify, simulator)
      run: go build ./tools/notify ./tools/simulator

    - name: go test
      run: go test ./datastore/postgres/... ./telemetry/... ./tools/...

    - name: Dashboard JSON
      run: for f in deploy/grafana/dashboards/*.json; do jq empty "$f" || exit 1; done

    - name: psql client
      run: sudo apt-get update -y && sudo apt-get install -y postgresql-client jq shellcheck

    - name: Migrations, fresh install
      run: SQL_DIR=deploy/sql POSTGRES_DB=tesla bash deploy/sql-init/00_apply_migrations.sh

    - name: Migrations, FORCE=1 re-run
      run: FORCE=1 SQL_DIR=deploy/sql POSTGRES_DB=tesla bash deploy/sql-init/00_apply_migrations.sh

    - name: Integration tests against the migrated database
      run: TEST_PG_DSN="postgres://postgres:${PGPASSWORD}@timescaledb:5432/tesla?sslmode=disable" go test -tags=integration ./datastore/postgres/...

    - name: EXPLAIN every dashboard query as grafana_ro
      run: PGPASSWORD=$GRAFANA_RO_PASSWORD python3 tools/explain_panels.py --psql "psql -X -h timescaledb -U grafana_ro -d tesla"

    - name: Shell scripts
      run: |
        for f in tools/backup.sh tools/backup_pull.sh tools/weekly_report.sh; do bash -n "$f" || exit 1; done
        shellcheck tools/backup.sh tools/backup_pull.sh tools/weekly_report.sh

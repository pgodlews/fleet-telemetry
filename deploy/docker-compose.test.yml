name: tesla-telemetry-test

# Test environment for <test-machine> homelab.
# - TimescaleDB on port 5435 (avoids conflict with another database on 5432)
# - Grafana on port 3004
# - fleet-telemetry on port 4444 (testing only, no mTLS cert required)
# - Simulator (always on — no profile gate) writing directly to postgres
#
# Pre-requisites on <test-machine>:
#   1. mkdir -p ~/docker/tesla-test/pgdata
#   2. docker compose -f docker-compose.test.yml up -d --build
#      On an empty data directory the init script applies every migration in
#      sql/migrations.txt (same runner as production).
#   3. Optional: restore a pg_dump snapshot instead of starting empty:
#        docker exec tesla-test-timescaledb psql -U postgres -c "SELECT timescaledb_pre_restore();"
#        docker exec -i tesla-test-timescaledb pg_restore -U postgres -d tesla --no-owner --role=postgres /tmp/snapshot.dump
#        docker exec tesla-test-timescaledb psql -U postgres -c "SELECT timescaledb_post_restore();"
#      then bring the schema up to date with the manifest runner:
#        docker exec -e SQL_DIR=/sql tesla-test-timescaledb bash /docker-entrypoint-initdb.d/00_apply_migrations.sh
#
# Grafana: http://<test-machine>:3004  (admin / $GF_ADMIN_PASSWORD, default admin)
# TimescaleDB: psql -h <test-machine> -p 5435 -U postgres -d tesla

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  timescaledb-test:
    image: timescale/timescaledb-ha:pg16.13-ts2.26.4-all
    container_name: tesla-test-timescaledb
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: tesla
      GRAFANA_RO_PASSWORD: ${GF_TESLA_DB_PASSWORD:-grafana_ro}
    # Same server settings as deploy/docker-compose.yml (see the comments there).
    command:
      - postgres
      - -c
      - max_worker_processes=${PG_MAX_WORKER_PROCESSES:-32}
      - -c
      - timescaledb.max_background_workers=${PG_TS_MAX_BACKGROUND_WORKERS:-24}
      - -c
      - max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-4}
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
    shm_size: 256mb
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ${TESLA_TEST_PGDATA:-/home/<your-user>/docker/tesla-test/pgdata}:/home/postgres/pgdata/data
      - ./sql:/sql:ro
      - ./sql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tesla"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - tesla-test

  grafana-test:
    image: grafana/grafana:11.6.16
    container_name: tesla-test-grafana
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      timescaledb-test:
        condition: service_healthy
    ports:
      - "3004:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_TESLA_DB_HOST: timescaledb-test:5432
      GF_TESLA_DB_PASSWORD: ${GF_TESLA_DB_PASSWORD:-grafana_ro}
    volumes:
      - tesla_test_grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboard-configs:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - tesla-test

  fleet-telemetry-test:
    profiles: ["ft"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tesla-test-fleet-telemetry
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      timescaledb-test:
        condition: service_healthy
    ports:
      - "4444:4443"   # mTLS WebSocket (test only — no real certs needed for simulator path)
      - "9091:9090"   # metrics / health (avoids conflict with prometheus on 9090)
    volumes:
      - ./fleet-telemetry/config.json:/etc/fleet-telemetry/config.json:ro
      - ./fleet-telemetry/certs:/etc/fleet-telemetry/certs:ro
    environment:
      - CONFIG_FILENAME=/etc/fleet-telemetry/config.json
    networks:
      - tesla-test

  simulator:
    build:
      context: ..
      dockerfile: tools/simulator/Dockerfile
    image: fleet-telemetry-simulator:latest
    container_name: tesla-test-simulator
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      timescaledb-test:
        condition: service_healthy
    environment:
      SIMULATOR_CONN: "postgres://postgres:${POSTGRES_PASSWORD:-changeme}@timescaledb-test:5432/tesla"
      SIMULATOR_VINS: "5YJ3E1EA7NF000001,7G2CCFG00PF000001,5YJ3E7EC1RF000001"
      SIMULATOR_INTERVAL: "30"
      SIMULATOR_BACKFILL_DAYS: "90"
    networks:
      - tesla-test

volumes:
  tesla_test_grafana_data:

networks:
  tesla-test:
    name: tesla-test

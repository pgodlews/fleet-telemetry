# tesla.example.com — Tesla Fleet Telemetry public endpoint
#
# Responsibilities:
#   1. Serve the EC public key at the path Tesla requires for virtual-key pairing
#   2. HTTP → HTTPS redirect
#
# fleet-telemetry mTLS (port 4443) is NOT proxied here — the Go server
# terminates mTLS itself.  UFW allows :4443 directly.
#
# Install:
#   sudo cp tesla.example.com.conf /etc/nginx/sites-available/tesla.example.com
#   sudo ln -s /etc/nginx/sites-available/tesla.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tesla.example.com

server {
    listen 80;
    listen [::]:80;
    server_name tesla.example.com;

    # certbot will rewrite this block; keep the well-known path accessible
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tesla.example.com;

    # TLS — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/tesla.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tesla.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Tesla virtual-key public key
    # Place your EC public key at the path below.
    # Generate with:
    #   openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem
    #   openssl ec -in private-key.pem -pubout -out public-key.pem
    location = /.well-known/appspecific/com.tesla.3p.public-key.pem {
        alias /etc/tesla/public-key.pem;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    # Health-check / status page (returns 200 for uptime monitoring)
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Block everything else
    location / {
        return 404;
    }
}
